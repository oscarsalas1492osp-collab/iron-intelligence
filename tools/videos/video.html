<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<style>
@font-face { font-family: Archivo; src: url(archivo-latin.woff2) format('woff2'); font-weight: 100 900; font-stretch: 62% 125%; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; background: #070d10; overflow: hidden; font-family: Archivo, sans-serif; color: #f2f6f6; }
#st { position: absolute; inset: 0; overflow: hidden; }
.glow { position: absolute; left: -200px; top: 380px; width: 1480px; height: 1480px; border-radius: 50%; background: radial-gradient(closest-side, rgb(255 106 26 / .16), rgb(255 106 26 / 0) 70%); }
.ring { position: absolute; left: 50%; top: 1120px; width: 1500px; height: 1500px; margin: -750px 0 0 -750px; border-radius: 50%; border: 44px solid rgb(185 232 242 / .05); }
.abs { position: absolute; will-change: transform, opacity; }
.hook { left: 80px; top: 290px; width: 920px; font-stretch: 75%; font-weight: 900; font-size: 168px; line-height: .98; letter-spacing: -2px; text-wrap: balance; }
.hook span { display: block; }
.masc { left: 90px; top: 760px; width: 900px; height: 900px; }
.masc img { width: 100%; height: 100%; display: block; }
.cap { left: 80px; top: 270px; width: 920px; font-stretch: 78%; font-weight: 900; font-size: 104px; line-height: 1.02; letter-spacing: -1px; }
.phone { left: 250px; top: 520px; width: 580px; height: 1056px; border-radius: 62px; padding: 12px; background: #0c161a; box-shadow: 0 0 0 2px rgb(190 240 245 / .16), 0 50px 120px rgb(0 0 0 / .7); overflow: hidden; }
.phone .scr { width: 100%; height: 100%; border-radius: 50px; overflow: hidden; position: relative; background: #070d10; }
.phone img { position: absolute; left: 0; top: 0; width: 100%; transform-origin: 0 0; }
.mini { left: 640px; top: 1210px; width: 420px; height: 420px; }
.mini img { width: 100%; height: 100%; }
.end1 { left: 80px; top: 300px; width: 920px; font-stretch: 75%; font-weight: 900; font-size: 150px; line-height: .98; letter-spacing: -2px; }
.end2 { left: 80px; top: 640px; width: 900px; font-stretch: 100%; font-weight: 600; font-size: 58px; line-height: 1.2; color: #93a4ab; }
.brand { left: 80px; top: 1500px; display: flex; align-items: center; gap: 22px; font-stretch: 112%; font-weight: 900; font-size: 44px; line-height: 1; letter-spacing: 1px; }
.brand img { width: 84px; height: 84px; border-radius: 20px; }
.fire { color: #ff6a1a; }
</style></head><body>
<div id="st">
  <div class="glow abs" id="glow"></div><div class="ring"></div>
  <div class="abs hook" id="hook"></div>
  <div class="abs masc" id="masc"><img src="mascota.png"></div>
  <div class="abs cap" id="cap"></div>
  <div class="abs phone" id="phone"><div class="scr"><img id="shot"></div></div>
  <div class="abs mini" id="mini"><img src="mascota.png"></div>
  <div class="abs end1" id="end1">Link en<br>el perfil</div>
  <div class="abs end2" id="end2">Sígueme para estar atento al lanzamiento</div>
  <div class="abs brand" id="brand"><img src="icon.png"><span>IRON<br>INTELLIGENCE</span></div>
</div>
<script>
const V = {
  1: { hook: ['¿Subes el peso', 'o repites?'],
       shots: [['marca.png', 3, 5.6, 0], ['rir.png', 5.6, 8.2, 0], ['rec.png', 8.2, 11.4, 1]],
       caps: [['Anotas tus series', 3, 5.6], ['y cuántas te quedaban', 5.6, 8.2], ['La app te dice <span class="fire">cuándo subir</span>', 8.2, 11.4]] },
  2: { hook: ['¿Sigues anotando', 'en las notas?'],
       shots: [['serie.png', 3, 7.2, 2], ['marca.png', 7.2, 11.4, 0]],
       caps: [['Aquí son <span class="fire">tres toques</span>', 3, 7.2], ['y la serie queda anotada', 7.2, 11.4]] },
  3: { hook: ['Anotas mientras', 'descansas'],
       shots: [['marca.png', 3, 5.8, 0], ['reloj.png', 5.8, 8.6, 0], ['rec.png', 8.6, 11.4, 1]],
       caps: [['Terminas la serie y la marcas', 3, 5.8], ['El descanso <span class="fire">corre solo</span>', 5.8, 8.6], ['y llegas sabiendo qué peso te toca', 8.6, 11.4]] }
};
const id = +(new URLSearchParams(location.search).get('v') || 1), C = V[id];
const $ = (x) => document.getElementById(x);
$('hook').innerHTML = C.hook.map((l) => '<span>' + l + '</span>').join('');
const out = (x) => 1 - Math.pow(1 - x, 4), cl = (x) => Math.max(0, Math.min(1, x));
const seg = (t, a, b) => cl((t - a) / (b - a));
function set(el, o, x, y, s) { el.style.opacity = o; el.style.transform = 'translate(' + (x || 0) + 'px,' + (y || 0) + 'px) scale(' + (s == null ? 1 : s) + ')'; }
window.render = function (t) {
  // 0-3 gancho
  const hIn = out(seg(t, 0, .45)), hOut = seg(t, 2.6, 3);
  const lines = $('hook').children;
  for (let i = 0; i < lines.length; i++) { const p = out(seg(t, i * .14, .5 + i * .14)); lines[i].style.opacity = p * (1 - hOut); lines[i].style.transform = 'translateY(' + ((1 - p) * 46 - hOut * 30) + 'px)'; }
  const mIn = out(seg(t, .15, .8)), bob = Math.sin(t * 2.2) * 10;
  set($('masc'), mIn * (1 - hOut), 0, (1 - mIn) * 80 + bob + hOut * 40, .94 + mIn * .06);
  // 3-11.4 pantallas
  const pIn = out(seg(t, 2.9, 3.5)), pOut = seg(t, 11.3, 11.7);
  set($('phone'), pIn * (1 - pOut), 0, (1 - pIn) * 120 + pOut * 60, .96 + pIn * .04);
  let cur = null; for (const s of C.shots) if (t >= s[1] - .05) cur = s;
  if (cur) {
    const img = $('shot'); if (img.dataset.s !== cur[0]) { img.src = cur[0]; img.dataset.s = cur[0]; }
    const k = seg(t, cur[1], cur[2]);
    // modo 0: imagen 4:5, se ve entera arriba y baja un poco; 1: zoom a la recomendación; 2: zoom a la serie activa
    if (cur[3] === 0) { img.style.transform = 'translate(0px,' + (150 - k * 30) + 'px) scale(1)'; }
    else if (cur[3] === 1) { const z = 1 + out(k) * .1; img.style.transform = 'translate(' + (-(z - 1) * 278) + 'px,' + (-out(k) * 150) + 'px) scale(' + z + ')'; }
    else { const z = 1 + out(k) * .1; img.style.transform = 'translate(' + (-(z - 1) * 278) + 'px,' + (-out(k) * 90) + 'px) scale(' + z + ')'; }
    img.style.opacity = out(seg(t, cur[1] - .05, cur[1] + .3));
  }
  let cp = null; for (const c of C.caps) if (t >= c[1] && t < c[2]) cp = c;
  const cap = $('cap');
  if (cp) { if (cap.dataset.c !== cp[0]) { cap.innerHTML = cp[0]; cap.dataset.c = cp[0]; } const a = out(seg(t, cp[1], cp[1] + .35)), b = seg(t, cp[2] - .2, cp[2]); set(cap, a * (1 - b), 0, (1 - a) * 30); }
  else set(cap, 0);
  const miIn = out(seg(t, 3.4, 4)), miOut = seg(t, 11.2, 11.6);
  set($('mini'), miIn * (1 - miOut), (1 - miIn) * 120, Math.sin(t * 2.2) * 8, 1);
  // 11.6-15 cierre
  const e1 = out(seg(t, 11.6, 12.1)), e2 = out(seg(t, 12, 12.5)), e3 = out(seg(t, 12.3, 12.8));
  set($('end1'), e1, 0, (1 - e1) * 40); set($('end2'), e2, 0, (1 - e2) * 30); set($('brand'), e3, 0, (1 - e3) * 20);
  if (t >= 11.6) { const m = out(seg(t, 11.7, 12.4)); const el = $('masc'); el.style.opacity = m; el.style.transform = 'translate(150px,' + (60 + (1 - m) * 80 + Math.sin(t * 2.2) * 10) + 'px) scale(.78)'; }
  $('glow').style.opacity = .6 + .4 * Math.sin(t * .9);
};
render(0);
</script></body></html>
