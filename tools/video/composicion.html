<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<style>
@font-face { font-family: 'Archivo V'; src: url('/assets/archivo-latin-standard-normal-DY7AcnAa.woff2') format('woff2'); font-weight: 100 900; font-stretch: 62% 125%; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #070d10; }
body { font-family: 'Archivo V', system-ui, sans-serif; color: #f2f6f6; position: relative; }
.bg { position: absolute; inset: 0; background:
  radial-gradient(900px 700px at 8% 6%, rgba(255,106,26,.16), transparent 62%),
  radial-gradient(900px 900px at 100% 78%, rgba(88,199,255,.07), transparent 60%), #070d10; }
.abs { position: absolute; will-change: transform, opacity; }
#marca { left: 110px; top: 262px; display: flex; align-items: center; gap: 20px; }
#marca img { width: 60px; height: 60px; border-radius: 14px; }
#marca b { display: block; font-size: 30px; font-weight: 800; font-stretch: 125%; letter-spacing: .04em; line-height: 1; }
#marca span { display: block; font-size: 17px; font-weight: 600; font-stretch: 100%; letter-spacing: .34em; color: #93a4ab; margin-top: 7px; }
.cap { left: 110px; top: 342px; width: 860px; font-size: 88px; line-height: .98; font-weight: 800; font-stretch: 75%; letter-spacing: -.005em; text-wrap: balance; }
#gancho { left: 110px; top: 470px; width: 900px; font-size: 176px; line-height: .9; font-weight: 800; font-stretch: 75%; letter-spacing: -.01em; }
#gancho2 { left: 110px; top: 1150px; width: 860px; font-size: 62px; line-height: 1.08; font-weight: 600; font-stretch: 78%; color: #93a4ab; }
#tarjeta { left: 110px; top: 574px; width: 770px; height: 1240px; border-radius: 54px; overflow: hidden; border: 3px solid #363b43; background: #070d10; box-shadow: 0 40px 120px rgba(0,0,0,.55), 0 0 0 1px rgba(0,0,0,.4); }
#tarjeta img { position: absolute; left: 0; top: 0; width: 100%; height: auto; display: block; }
#toque { width: 150px; height: 150px; margin: -75px 0 0 -75px; border-radius: 50%; border: 6px solid #ffb054; background: rgba(255,176,84,.18); opacity: 0; }
#punto { width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; background: rgba(255,255,255,.92); box-shadow: 0 6px 22px rgba(0,0,0,.45); opacity: 0; }
#fin { left: 110px; top: 560px; width: 860px; }
#fin img { width: 210px; height: 210px; border-radius: 48px; display: block; }
#fin h1 { margin-top: 64px; font-size: 118px; line-height: .92; font-weight: 800; font-stretch: 125%; letter-spacing: .01em; }
#fin h1 span { display: block; font-size: 52px; font-weight: 600; font-stretch: 100%; letter-spacing: .36em; color: #93a4ab; margin-top: 22px; }
#fin p { margin-top: 70px; font-size: 76px; line-height: 1; font-weight: 700; font-stretch: 75%; }
#fin .cta { margin-top: 60px; font-size: 64px; line-height: 1.04; font-weight: 800; font-stretch: 78%; color: #ff6a1a; text-wrap: balance; }
#fin .pie { margin-top: 26px; font-size: 44px; font-weight: 600; font-stretch: 78%; color: #93a4ab; }
#fin .pie:empty { display: none; }
</style></head>
<body>
<div class="bg"></div>
<div id="marca" class="abs"><img src="/icon.svg" alt=""><div><b>IRON</b><span>INTELLIGENCE</span></div></div>
<div id="gancho" class="abs"></div>
<div id="gancho2" class="abs"></div>
<div id="capA" class="abs cap"></div>
<div id="capB" class="abs cap"></div>
<div id="tarjeta" class="abs"><img id="imgA" alt=""><img id="imgB" alt=""></div>
<div id="toque" class="abs"></div>
<div id="punto" class="abs"></div>
<div id="fin" class="abs"><img src="/icon.svg" alt=""><h1>IRON<span>INTELLIGENCE</span></h1><p>Registra. Analiza. Progresa.</p><div class="cta" id="fin-cta">Enlace en el perfil</div><div class="pie" id="fin-pie"></div></div>
<script>
// Composición del video: todo depende de render(t), con t en segundos. Nada se mueve por su cuenta.
const ESC = 770 / 360, X0 = 110, Y0 = 574;                       // de px de la app a px del video
const pos = (b) => [X0 + (b[0] + b[2] / 2) * ESC, Y0 + (b[1] + b[3] / 2) * ESC];
const out = (p) => 1 - Math.pow(1 - Math.min(1, Math.max(0, p)), 4);   // salida fuerte
const lerp = (a, b, p) => a + (b - a) * p;
const $ = (id) => document.getElementById(id);
let ESCENAS = [], FIN = 0, GANCHO = null;
window.setup = (cfg) => {
  ESCENAS = cfg.escenas; FIN = cfg.fin; GANCHO = cfg.gancho;
  $('gancho').innerHTML = (cfg.gancho?.lineas ?? []).map((l) => `<div>${l}</div>`).join('');
  $('gancho2').textContent = cfg.gancho?.bajada ?? '';
  if (cfg.fin?.cta) $('fin-cta').textContent = cfg.fin.cta;
  $('fin-pie').textContent = cfg.fin?.pie ?? '';
  const urls = [...new Set(ESCENAS.flatMap((e) => e.estados.map((s) => s.img)))];
  return Promise.all([document.fonts.ready, ...urls.map((u) => new Promise((ok) => { const i = new Image(); i.onload = ok; i.onerror = ok; i.src = u; }))]);
};
function set(el, o, y = 0, s = 1) { el.style.opacity = o.toFixed(3); el.style.transform = `translateY(${y.toFixed(2)}px) scale(${s.toFixed(4)})`; }
window.render = (t) => {
  const g = GANCHO;
  // 1) Gancho en texto
  if (g) {
    const o = t < g.fin - 0.18 ? out(t / 0.28) : 1 - out((t - (g.fin - 0.18)) / 0.18);
    set($('gancho'), o, lerp(26, 0, out(t / 0.4)));
    const o2 = t < g.bajadaEn ? 0 : t < g.fin - 0.18 ? out((t - g.bajadaEn) / 0.28) : 1 - out((t - (g.fin - 0.18)) / 0.18);
    set($('gancho2'), o2, lerp(18, 0, out((t - g.bajadaEn) / 0.35)));
  } else { set($('gancho'), 0); set($('gancho2'), 0); }
  // 2) Escenas de la app
  const i = ESCENAS.findIndex((e) => t >= e.de && t < e.a), e = ESCENAS[i];
  const first = ESCENAS[0], last = ESCENAS[ESCENAS.length - 1];
  // tarjeta: entra al empezar la primera escena, sale al terminar la última
  let co = 0, cy = 0;
  if (first && t >= first.de && t < last.a) { const p = out((t - first.de) / 0.38), q = out((t - (last.a - 0.22)) / 0.22); co = t > last.a - 0.22 ? 1 - q : p; cy = t > last.a - 0.22 ? lerp(0, 40, q) : lerp(70, 0, p); }
  set($('tarjeta'), co, cy);
  // rótulo: dos capas para que el cambio no salte
  const capA = $('capA'), capB = $('capB');
  if (e) {
    const lt = t - e.de, into = out(lt / 0.24), leaving = t > e.a - 0.14 ? out((t - (e.a - 0.14)) / 0.14) : 0;
    capA.textContent = e.rotulo; set(capA, into * (1 - leaving), lerp(16, 0, into)); set(capB, 0);
    // estado de la app y fundido con el anterior
    let k = 0; for (let j = 0; j < e.estados.length; j++) if (lt >= e.estados[j].en) k = j;
    const cur = e.estados[k], prev = k > 0 ? e.estados[k - 1] : (i > 0 ? ESCENAS[i - 1].estados.at(-1) : null);
    const f = Math.min(1, (lt - cur.en) / 0.14);
    const A = $('imgA'), B = $('imgB');
    // acercamiento lento a una zona de la pantalla (para una escena que se queda en un solo estado)
    const z = e.zoom ? lerp(1, e.zoom.hasta, Math.min(1, lt / (e.a - e.de))) : 1, zo = e.zoom ? `${e.zoom.x}% ${e.zoom.y}%` : '50% 50%';
    A.style.transformOrigin = B.style.transformOrigin = zo; A.style.transform = B.style.transform = `scale(${z.toFixed(4)})`;
    if (prev && f < 1) { if (A.dataset.u !== prev.img) { A.src = prev.img; A.dataset.u = prev.img; } if (B.dataset.u !== cur.img) { B.src = cur.img; B.dataset.u = cur.img; } A.style.opacity = 1; B.style.opacity = f.toFixed(3); }
    else { if (A.dataset.u !== cur.img) { A.src = cur.img; A.dataset.u = cur.img; } A.style.opacity = 1; B.style.opacity = 0; }
    // toque: punto que aparece un instante antes y anillo que se abre
    const tq = $('toque'), pt = $('punto'); let ro = 0, rs = 1, po = 0, ps = 1, x = 0, y = 0;
    for (const tp of e.toques ?? []) {
      const d = lt - tp.en;
      if (d >= -0.32 && d < 0.5) { [x, y] = pos(tp.caja); po = d < 0 ? out((d + 0.32) / 0.2) * 0.95 : 0.95 * (1 - out(d / 0.3)); ps = d < 0 ? lerp(1.25, 1, out((d + 0.32) / 0.2)) : lerp(0.86, 1, out(d / 0.2)); if (d >= 0) { ro = 0.95 * (1 - out(d / 0.5)); rs = lerp(0.55, 1.2, out(d / 0.5)); } }
    }
    tq.style.left = pt.style.left = x + 'px'; tq.style.top = pt.style.top = (y + cy) + 'px';
    set(tq, ro, 0, rs); set(pt, po, 0, ps);
  } else { set(capA, 0); set(capB, 0); set($('toque'), 0); set($('punto'), 0); }
  // 3) Marca arriba (todo el video menos el cierre) y cierre
  const fin = FIN;
  set($('marca'), fin && t >= fin.de - 0.2 ? 1 - out((t - (fin.de - 0.2)) / 0.2) : out(t / 0.3));
  if (fin && t >= fin.de) { const p = out((t - fin.de) / 0.45); set($('fin'), p, lerp(36, 0, p)); } else set($('fin'), 0);
  return true;
};
</script></body></html>
